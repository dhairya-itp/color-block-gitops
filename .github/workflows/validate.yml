name: validate
on:
  push:
    paths: ["k8s/**", ".github/workflows/validate.yml"]
  pull_request:

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Schema-check manifests (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary k8s/
      - name: COLOR is a hex value
        run: grep -A1 -- '- name: COLOR' k8s/deployment.yaml | grep -Eq 'value: "#[0-9A-Fa-f]{6}"'
