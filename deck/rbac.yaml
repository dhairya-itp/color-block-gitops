# Only what the bridge needs: read and refresh the Argo CD app, watch the demo, and scale it for the drift step.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deck
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deck-bridge
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["color-block"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deck-bridge
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deck-bridge
subjects:
  - kind: ServiceAccount
    name: deck
    namespace: deck
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deck-bridge
  namespace: demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["color-block"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["color-block"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deck-bridge
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deck-bridge
subjects:
  - kind: ServiceAccount
    name: deck
    namespace: deck
